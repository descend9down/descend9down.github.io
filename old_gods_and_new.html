    padding: 8px 20px;
    font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .btn:hover {
    background: rgba(160, 20, 60, 0.15);
    border-color: rgba(200, 60, 120, 0.85);
    color: #fff; box-shadow: 0 0 12px rgba(160, 20, 60, 0.4);
  }
  #mode-label {
    position: fixed; top: 28px; left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 60, 120, 0.85);
    font-size: 12px; letter-spacing: 5px; text-transform: uppercase;
    z-index: 100; pointer-events: none;
  }
  #hint {
    color: rgba(200, 60, 120, 0.65);
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
    pointer-events: none;
  }

    bottom: 14px; right: 18px;

    font-size: 9px; letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 200;
    font-family: 'Courier New', monospace;

const img = document.getElementById('base-img');
const stage = document.getElementById('stage');
const kCanvas = document.getElementById('kaleidoscope-canvas');
const modeLabel = document.getElementById('mode-label');
const hint = document.getElementById('hint');

let beholderImg = new Image();
let imgLoaded = false;
let kSlices = 9;
let kaleido = null;
beholderImg.onload = () => {
  imgLoaded = true;
  img.src = IMG_SRC;
  resizeAll();
};
beholderImg.src = IMG_SRC;

function resizeAll() {
  if (kaleido) kaleido.resize();
}
window.addEventListener('resize', resizeAll);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggleKaleidoscope(); }
  if (e.key >= '2' && e.key <= '9') {
    kSlices = parseInt(e.key) * 2;
    if (kaleido) kaleido.setSlices(kSlices);
    if (kaleido && kaleido.active) modeLabel.textContent = `KALOS EIDOS ✦ ${kSlices} AXES`;
  }
});

// ─── VORONOI ─────────────────────────────────────────────
// ─── KALEIDOSCOPE ─────────────────────────────────────────
function toggleKaleidoscope() {
  if (!imgLoaded) return;
  if (!kaleido) kaleido = new KaleidoscopeFX(kCanvas, beholderImg, { glowColor: [200, 40, 100] });
  const isActive = kaleido.toggle();
  if (isActive) {
    img.style.opacity = '0';
    kCanvas.style.opacity = '1';
    modeLabel.textContent = `KALOS EIDOS ✦ ${kSlices} AXES`;
  } else {
    kCanvas.style.opacity = '0';
    img.style.opacity = '1';
    modeLabel.textContent = 'OCULUS';
  }
}

</script>
