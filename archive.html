<style>
  :root {
    --paper: #ead9b8;
    --paper-light: #f4ead0;
    --paper-mid: #d7c196;
    --paper-dark: #b59c6b;
    --ink: #2b1d12;
    --ink-dim: rgba(43,29,18,0.58);
    --ink-faint: rgba(43,29,18,0.4);
    --accent: #a9752a;
    --accent-dim: #7a5510;
    --accent-glow: rgba(169,117,42,0.35);
    --border: rgba(107,78,40,0.28);
    --border-strong: rgba(107,78,40,0.55);
    --noise-opacity: 0.45;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* paper grain */
  body::before {
    content:''; position:fixed; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: var(--noise-opacity);
    mix-blend-mode: multiply;
    pointer-events: none; z-index:9996;
  }

  /* foxing stains — a few soft rust-colored blotches, like age spots on old paper */
  body::after {
    content:''; position:fixed; inset:0;
    background-image:
      radial-gradient(ellipse 180px 140px at 12% 22%, rgba(139,90,43,0.16), transparent 70%),
      radial-gradient(ellipse 140px 110px at 82% 15%, rgba(139,90,43,0.12), transparent 70%),
      radial-gradient(ellipse 220px 160px at 90% 70%, rgba(139,90,43,0.14), transparent 70%),
      radial-gradient(ellipse 160px 120px at 18% 85%, rgba(139,90,43,0.13), transparent 70%),
      radial-gradient(ellipse 130px 100px at 55% 45%, rgba(139,90,43,0.07), transparent 70%);
    mix-blend-mode: multiply;
    pointer-events: none; z-index:9997;
  }

  /* soft vignette at the page edges, like a scanned document or an old photograph */
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 90% 70% at 50% 40%, transparent 55%, rgba(43,29,18,0.22) 100%);
    pointer-events: none; z-index: 9998;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top:0; left:0; right:0; z-index:100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px;
    background: rgba(234, 217, 184, 0.92);
    border-bottom: 1px solid var(--border-strong);
    backdrop-filter: blur(14px);
  }

  .nav-brand {
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-links {
    display: flex; gap: 8px; align-items: center;
  }

  .nav-links a {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-decoration: none;
    padding: 5px 12px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 0.25s ease;
    color: var(--ink-dim);
  }

  /* each page's own accent on hover / active */
  .nav-links a[data-page="gallery"]:hover,
  .nav-links a[data-page="gallery"].active {
    color: #7b4fd4;
    border-color: rgba(123,79,212,0.4);
    background: rgba(123,79,212,0.08);
  }
  .nav-links a[data-page="omnia"]:hover,
  .nav-links a[data-page="omnia"].active {
    color: #cbb98a;
    border-color: rgba(203,185,138,0.4);
    background: rgba(203,185,138,0.08);
  }
  .nav-links a[data-page="archetypes"]:hover,
  .nav-links a[data-page="archetypes"].active {
    color: #e8e4da;
    border-color: rgba(232,228,218,0.4);
    background: rgba(232,228,218,0.08);
  }
  .nav-links a[data-page="archive"]:hover,
  .nav-links a[data-page="archive"].active {
    color: var(--accent);
    border-color: rgba(169,117,42,0.45);
    background: rgba(169,117,42,0.1);
  }
  .nav-links a[data-page="d9s"]:hover,
  .nav-links a[data-page="d9s"].active {
    color: #0c8f86;
    border-color: rgba(12,143,134,0.4);
    background: rgba(12,143,134,0.08);
  }

  /* ── HERO ── */
  .hero {
    padding: 140px 40px 60px;
    text-align: center;
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  .hero-eyebrow {
    font-family: 'VT323', monospace;
    font-size: 15px;
    letter-spacing: 0.4em;
    color: var(--accent);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  /* reads like a stamped ledger heading rather than a neon sign — a
     pulsing glow doesn't sit right on paper, so this is a flat brass ink
     color with a soft sunken shadow instead, as if pressed into the page */
  .hero-title {
    font-size: clamp(52px, 10vw, 120px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: 0.01em;
    color: var(--accent);
    text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 3px 10px rgba(43,29,18,0.25);
    position: relative;
  }

  .hero-sub {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--ink-dim);
    margin-top: 16px;
  }

  .hero-divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    margin: 32px auto 0;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    padding: 0 40px;
    margin-bottom: 32px;
    display: flex; align-items: center; gap: 16px;
  }

  .section-label span {
    font-family: 'VT323', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .section-label::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(to right, var(--accent-dim), transparent);
  }

  /* ── GRID — mounted photo prints, not hover-reveal tiles ── */
  .archive-grid {
    position: relative; z-index: 1;
    padding: 10px 32px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 34px 28px;
  }

  .archive-item {
    background: var(--paper-light);
    padding: 10px 10px 6px;
    box-shadow: 0 10px 22px -10px rgba(43,29,18,0.35), 0 1px 0 rgba(255,255,255,0.5) inset;
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .archive-item:hover {
    transform: scale(1.035);
    box-shadow: 0 18px 32px -12px rgba(43,29,18,0.45), 0 1px 0 rgba(255,255,255,0.5) inset;
    z-index: 2;
  }

  .archive-item img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
    filter: sepia(0.22) saturate(0.92) contrast(1.03) brightness(0.98);
  }

  .archive-item-caption {
    text-align: center;
    padding: 10px 4px 6px;
  }

  .archive-item-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--ink);
    text-transform: uppercase;
  }

  .archive-item-meta {
    font-family: 'VT323', monospace;
    font-size: 12.5px;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-top: 3px;
  }

  /* ── LIGHTBOX — a dim viewing room rather than a flat black modal ── */
  .lightbox {
    display:none;
    position:fixed; inset:0; z-index:500;
    background: rgba(24, 16, 9, 0.96);
    align-items:center; justify-content:center;
    flex-direction:column;
  }
  .lightbox.open { display:flex; }

  .lightbox-img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border: 6px solid var(--paper-light);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .lightbox-caption {
    margin-top:16px;
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.35em;
    color: var(--accent);
    text-align:center;
  }

  .lightbox-close {
    position:absolute; top:24px; right:32px;
    font-family:'VT323',monospace; font-size:28px;
    color:var(--paper-mid); cursor:pointer;
    background:none; border:none;
    transition: color 0.2s;
  }
  .lightbox-close:hover { color:var(--accent); }

  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    padding: 24px 40px;
    display:flex; justify-content:center; align-items:center; gap:12px;
    font-family:'VT323',monospace; font-size:13px;
    letter-spacing:0.2em; color:var(--ink-dim);
  }
  footer .sep { color:var(--accent-dim); }
.footer-logo {
  height: 40px;
  width: auto;
  opacity: 0.85;
}

  @media (max-width:600px) {
    /* a 5-item letter-spaced nav plus the full wordmark cannot fit one
       line on a phone without shrinking to unreadable text - so on
       narrow screens the nav drops out of fixed position, wraps to as
       many rows as it needs, and the page scrolls normally under it
       instead of assuming a fixed-height bar the rest of the layout
       has to leave room for. */
    nav {
      position: static;
      height: auto;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 0;
      padding: 14px 16px;
    }
    .nav-brand { width: 100%; text-align: center; }
    .nav-links { flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
    .nav-links a { font-size:9px; padding:4px 8px; }
    .hero { padding:32px 20px 40px; }
    .archive-grid { padding:10px 18px 60px; gap: 26px 18px; }
    .section-label { padding:0 16px; }
  }
</style>

<body>

<div class="vignette"></div>

<nav>
  <a href="index.html" class="nav-brand">DESCEND9DOWN</a>
  <div class="nav-links">
  <a href="index.html" data-page="gallery">PLEROMA</a>
  <a href="omnia.html" data-page="omnia">OMNIA</a>
  <a href="prints.html" data-page="archetypes">ARCHETYPES</a>
  <a href="archive.html" data-page="archive" class="active">ARCHIVE</a>
  <a href="https://descend9down.github.io/descend9sound" data-page="d9s">D9S</a>
</div>
  </div>
</nav>

<section class="hero">
  <div class="hero-eyebrow">Early Works · 2019 — 2023</div>
  <h1 class="hero-title">ARCHIVE</h1>
  <div class="hero-divider"></div>
</section>

<div class="section-label"><span>| WORKS</span></div>

<div class="archive-grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<footer>
  <span>All works protected</span>
  <span class="sep">·</span>
  <span>©DESCEND9DOWN</span>
<img class="footer-logo" src="d9d_trans_logo.png" alt="DESCEND9DOWN">
  <span>2026</span>
</footer>

<script>
  const images = [
  { src: "posters/art-archive/Ouroboros.JPG", title: "Ouroboros", year: "2019" },
  { src: "posters/art-archive/Turning_Blue.JPG", title: "Turning Blue", year: "2021" },
  { src: "posters/art-archive/The_One_Who_Teaches.jpg", title: "The One Who Teaches", year: "2021" },
  { src: "posters/art-archive/Malestrom.jpg", title: "Maelstrom", year: "2021" },
  { src: "posters/art-archive/Conjecture.JPG", title: "Conjecture", year: "2021" },
  { src: "posters/art-archive/Void_That_Binds.JPG", title: "Void That Binds", year: "2021" },
  { src: "posters/art-archive/Creation.jpg", title: "Creation", year: "2019" },
  { src: "posters/art-archive/Kronos.PNG", title: "Kronos", year: "2021" },
  { src: "posters/art-archive/Leave_Light_On.PNG", title: "Hold The Light", year: "2019" },
];

const grid = document.getElementById('grid');
images.forEach((item, idx) => {
  const el = document.createElement('div');
  el.className = 'archive-item';
  el.innerHTML = `
    <img src="${item.src}" alt="${item.title}" loading="lazy">
    <div class="archive-item-caption">
      <div class="archive-item-title">${item.title}</div>
      <div class="archive-item-meta">Digital · ${item.year}</div>
    </div>`;
  el.addEventListener('click', () => openLightbox(item.src, item.title, item.year));
  grid.appendChild(el);
});

function openLightbox(src, title, year) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = title + ' · ' + year;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e){
  if(e.target === this) closeLightbox();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });
</script>
</body>
