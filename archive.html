<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESCEND9DOWN · ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c8922a;
    --accent-dim: #7a5510;
    --accent-glow: rgba(200,146,42,0.35);
    --bg: #050403;
    --surface: #0e0a05;
    --text: #e8d5b0;
    --text-dim: #7a6a50;
    --noise-opacity: 0.04;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* noise overlay */
  body::before {
    content:''; position:fixed; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: var(--noise-opacity);
    pointer-events: none; z-index:9999;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top:0; left:0; right:0; z-index:100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px;
    background: linear-gradient(to bottom, rgba(5,4,3,0.95), transparent);
  }

  .nav-brand {
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-decoration: none;
  }

  .nav-links {
    display: flex; gap: 8px; align-items: center;
  }

  .nav-links a {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-decoration: none;
    padding: 5px 12px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 0.25s ease;
    color: var(--text-dim);
  }

  /* each page's own accent on hover / active */
  .nav-links a[data-page="gallery"]:hover,
  .nav-links a[data-page="gallery"].active {
    color: #dcc6ff;
    border-color: rgba(155,127,212,0.45);
    background: rgba(155,127,212,0.08);
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.7), 0 0 10px rgba(155,127,212,0.6);
  }
  .nav-links a[data-page="prints"]:hover,
  .nav-links a[data-page="prints"].active {
    color: #c0392b;
    border-color: rgba(192,57,43,0.45);
    background: rgba(192,57,43,0.08);
    text-shadow: 0 0 8px rgba(192,57,43,0.6);
  }
  .nav-links a[data-page="archive"]:hover,
  .nav-links a[data-page="archive"].active {
    color: var(--accent);
    border-color: rgba(200,146,42,0.45);
    background: rgba(200,146,42,0.08);
    text-shadow: 0 0 8px var(--accent-glow);
  }
  .nav-links a[data-page="d9s"]:hover,
  .nav-links a[data-page="d9s"].active {
    color: #00d4c8;
    border-color: rgba(0,212,200,0.45);
    background: rgba(0,212,200,0.08);
    text-shadow: 0 0 8px rgba(0,212,200,0.6);
  }

  /* ── HERO ── */
  .hero {
    padding: 140px 40px 60px;
    text-align: center;
    position: relative;
  }

  .hero-eyebrow {
    font-family: 'VT323', monospace;
    font-size: 15px;
    letter-spacing: 0.4em;
    color: var(--accent);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .hero-title {
    font-size: clamp(52px, 10vw, 120px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #c8922a 0%, #e8c870 35%, #c8922a 50%, #8a5e18 65%, #e8c870 80%, #c8922a 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 6s ease-in-out infinite;
    position: relative;
  }

  @keyframes shimmer {
    0%   { background-position: 200% center; }
    40%  { background-position: 0% center; }
    60%  { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .hero-sub {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--text-dim);
    margin-top: 16px;
  }

  .hero-divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    margin: 32px auto 0;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    padding: 0 40px;
    margin-bottom: 32px;
    display: flex; align-items: center; gap: 16px;
  }

  .section-label span {
    font-family: 'VT323', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .section-label::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(to right, var(--accent-dim), transparent);
  }

  /* ── GRID ── */
  .archive-grid {
    padding: 0 32px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 2px;
  }

  .archive-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #000;
    aspect-ratio: 3/4;
  }

  .archive-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease, filter 0.6s ease;
    filter: brightness(0.85) saturate(0.9);
  }

  .archive-item:hover img {
    transform: scale(1.04);
    filter: brightness(1) saturate(1.1);
  }

  .archive-item-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(5,4,3,0.9) 0%, rgba(5,4,3,0.2) 40%, transparent 70%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px 20px;
    transition: opacity 0.4s ease;
  }

  .archive-item:hover .archive-item-overlay {
    background: linear-gradient(to top, rgba(5,4,3,0.95) 0%, rgba(5,4,3,0.5) 50%, rgba(5,4,3,0.1) 80%);
  }

  .archive-item-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--text);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .archive-item-meta {
    font-family: 'VT323', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  /* amber corner accent on hover */
  .archive-item::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border: 1px solid transparent;
    transition: border-color 0.4s ease;
    pointer-events:none;
  }
  .archive-item:hover::after {
    border-color: rgba(200,146,42,0.3);
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display:none;
    position:fixed; inset:0; z-index:500;
    background: rgba(3,2,1,0.97);
    align-items:center; justify-content:center;
    flex-direction:column;
  }
  .lightbox.open { display:flex; }

  .lightbox-img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border: 1px solid rgba(200,146,42,0.2);
  }

  .lightbox-caption {
    margin-top:16px;
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.35em;
    color: var(--accent);
    text-align:center;
  }

  .lightbox-close {
    position:absolute; top:24px; right:32px;
    font-family:'VT323',monospace; font-size:28px;
    color:var(--text-dim); cursor:pointer;
    background:none; border:none;
    transition: color 0.2s;
  }
  .lightbox-close:hover { color:var(--accent); }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid rgba(200,146,42,0.15);
    padding: 24px 40px;
    display:flex; justify-content:center; align-items:center; gap:12px;
    font-family:'VT323',monospace; font-size:13px;
    letter-spacing:0.2em; color:var(--text-dim);
  }
  footer .sep { color:var(--accent-dim); }
.footer-logo {
  height: 40px;
  width: auto;
  opacity: 0.8;
}

/* LIGHTBOX */
  @media (max-width:600px) {
    nav { padding:14px 18px; }
    .nav-links a { font-size:9px; padding:4px 8px; }
    .hero { padding:100px 20px 40px; }
    .archive-grid { padding:0 0 60px; gap:1px; }
    .section-label { padding:0 16px; }
  }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RQZ9CLCNX1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RQZ9CLCNX1');
</script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">DESCEND9DOWN</a>
  <div class="nav-links">
  <a href="index.html" data-page="gallery">PLEROMA</a>
  <a href="omnia.html" data-page="omnia">OMNIA</a>
  <a href="prints.html" data-page="archetypes">ARCHETYPES</a>
  <a href="archive.html" data-page="archive" class="active">ARCHIVE</a>
  <a href="https://descend9down.github.io/descend9sound" data-page="d9s">D9S</a>
</div>
  </div>
</nav>

<section class="hero">
  <div class="hero-eyebrow">Early Works · 2019 — 2023</div>
  <h1 class="hero-title">DESCEND<br>9DOWN</h1>
  <p class="hero-sub">ARCHIVE</p>
  <div class="hero-divider"></div>
</section>

<div class="section-label"><span>| WORKS</span></div>

<div class="archive-grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<footer>
  <span class="footer-text shimmer-slow">All works protected</span>
  <span class="footer-text shimmer-slow">·</span>
  <span class="footer-text shimmer-slow">©DESCEND9DOWN</span>
<img class="footer-logo" src="d9d_trans_logo.png" alt="DESCEND9DOWN">  
  <span class="footer-text shimmer-slow">2026</span>
</footer>

<script>
  const images = [
  { src: "posters/art-archive/Ouroboros.JPG", title: "Ouroboros", year: "2019" },
  { src: "posters/art-archive/Turning_Blue.JPG", title: "Turning Blue", year: "2021" },
  { src: "posters/art-archive/The_One_Who_Teaches.jpg", title: "The One Who Teaches", year: "2021" },
  { src: "posters/art-archive/Malestrom.jpg", title: "Maelstrom", year: "2021" },
  { src: "posters/art-archive/Conjecture.JPG", title: "Conjecture", year: "2021" },
  { src: "posters/art-archive/Void_That_Binds.JPG", title: "Void That Binds", year: "2021" },
  { src: "posters/art-archive/Creation.jpg", title: "Creation", year: "2019" },
  { src: "posters/art-archive/Kronos.PNG", title: "Kronos", year: "2021" },
  { src: "posters/art-archive/Leave_Light_On.PNG", title: "Hold The Light", year: "2019" },
];

const grid = document.getElementById('grid');
images.forEach((item, idx) => {
  const el = document.createElement('div');
  el.className = 'archive-item';
  el.innerHTML = `
    <img src="${item.src}" alt="${item.title}" loading="lazy">
    <div class="archive-item-overlay">
      <div class="archive-item-title">${item.title}</div>
      <div class="archive-item-meta">Digital · ${item.year}</div>
    </div>`;
  el.addEventListener('click', () => openLightbox(item.src, item.title, item.year));
  grid.appendChild(el);
});

function openLightbox(src, title, year) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = title + ' · ' + year;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e){
  if(e.target === this) closeLightbox();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });
</script>
</body>
</html>
